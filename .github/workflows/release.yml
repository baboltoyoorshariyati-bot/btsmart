name: Build a reviewed draft release
on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  package:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Validate release identity
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < RELEASE_VERSION.txt)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          python3 scripts/update-checksums.py --check
          node --test tests/release-version.test.js tests/windows-installer.test.js
      - name: Build versioned assets
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: python3 scripts/arena-release-build.py "$RUNNER_TEMP/release-assets" . --expected-version "$VERSION"
      - name: Verify assets
        working-directory: ${{ runner.temp }}/release-assets
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: sha256sum --check --strict "SHA256SUMS-$VERSION.txt"
      - name: Create a new draft without replacing any existing release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          # gh release create itself fails if a release already exists. Never use --clobber.
          gh release create "v$VERSION" "$RUNNER_TEMP"/release-assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Babol Toyor $VERSION" --notes-file "RELEASE-$VERSION-fa.md"
